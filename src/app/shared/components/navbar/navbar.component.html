

<nav
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-4 md:px-8 py-3"
  [class.bg-black]="isScrolled"
  [class.bg-gradient-to-b]="!isScrolled"
  [class.from-black]="!isScrolled"
  [class.to-transparent]="!isScrolled"
>
  <div class="flex items-center justify-between max-w-screen-xl mx-auto">

    
    <a routerLink="/" class="text-2xl font-black tracking-wider" style="color: #e50914;">
      CINEFLIX
    </a>

    
    <div class="hidden md:flex items-center gap-6">
      <a
        routerLink="/"
        routerLinkActive="text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-gray-300 hover:text-white transition-colors text-sm font-medium"
      >
        Accueil
      </a>
      <a
        routerLink="/favorites"
        routerLinkActive="text-white"
        class="text-gray-300 hover:text-white transition-colors text-sm font-medium"
      >
        Mes Favoris
      </a>
    </div>

    
    <div class="hidden md:flex items-center gap-3">
      <div class="flex items-center bg-black/60 border border-gray-600 rounded px-3 py-1.5 gap-2">
        
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        
        <input
          type="text"
          placeholder="Rechercher..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          class="bg-transparent text-white text-sm outline-none w-40 placeholder-gray-400"
        />
      </div>
    </div>

    
    <button
      class="md:hidden text-white p-2"
      (click)="toggleMobileMenu()"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  
  
  <div *ngIf="isMobileMenuOpen" class="md:hidden bg-black mt-2 p-4 rounded-lg flex flex-col gap-4">
    <a routerLink="/" class="text-gray-300 hover:text-white" (click)="isMobileMenuOpen = false">
      Accueil
    </a>
    <a routerLink="/favorites" class="text-gray-300 hover:text-white" (click)="isMobileMenuOpen = false">
      Mes Favoris
    </a>
    
    <div class="flex items-center bg-gray-800 rounded px-3 py-2 gap-2">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input
        type="text"
        placeholder="Rechercher un film..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
        class="bg-transparent text-white text-sm outline-none flex-1 placeholder-gray-400"
      />
    </div>
  </div>
</nav>
