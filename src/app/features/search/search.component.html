
<div class="min-h-screen bg-gray-950 text-white">

  <app-navbar></app-navbar>

  <div class="pt-24 px-4 md:px-8 pb-16 max-w-screen-xl mx-auto">

    
    <div class="mb-8">
      <h1 class="text-3xl font-bold mb-4">Rechercher un film</h1>

      <div class="flex gap-3 max-w-xl">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="Titre du film..."
          class="flex-1 bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-red-600 transition-colors placeholder-gray-500"
        />
        <button
          (click)="onSearch()"
          class="px-6 py-3 font-bold rounded-lg text-white transition-colors"
          style="background-color: #e50914;"
        >
          Rechercher
        </button>
      </div>
    </div>

    
    <div *ngIf="isLoading" class="text-center py-20">
      <div class="inline-block w-12 h-12 border-4 border-gray-600 border-t-red-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-400">Recherche en cours...</p>
    </div>

    
    <ng-container *ngIf="!isLoading">

      
      <p *ngIf="hasSearched && searchResults.length > 0" class="text-gray-400 mb-6">
        {{ searchResults.length }} résultat(s) pour "{{ searchQuery }}"
      </p>

      
      
      <div
        *ngIf="searchResults.length > 0"
        class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-4"
      >
        <app-movie-card
          *ngFor="let movie of searchResults"
          [movie]="movie"
        ></app-movie-card>
      </div>

      
      <div *ngIf="hasSearched && searchResults.length === 0" class="text-center py-20">
        <div class="text-6xl mb-4">🎬</div>
        <h2 class="text-2xl font-bold mb-2">Aucun résultat</h2>
        <p class="text-gray-400">Aucun film trouvé pour "{{ searchQuery }}"</p>
        <p class="text-gray-500 text-sm mt-2">Essaie avec un autre titre</p>
      </div>

      
      <div *ngIf="!hasSearched" class="text-center py-20">
        <div class="text-6xl mb-4">🔍</div>
        <p class="text-gray-400 text-xl">Tape un titre pour commencer</p>
      </div>

    </ng-container>
  </div>
</div>
